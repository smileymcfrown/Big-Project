<title>Dumpling Kitchen Build Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a kitchen pass. Sticky order-rail (chapter nav) on the left, one reading column, code allowed to run wider. Chapters are numbered tickets because they are a real sequence. */
:root {
  --bg: #f2f5f3;          /* glazed porcelain */
  --surface: #ffffff;
  --ink: #18211e;         /* soy */
  --muted: #56645f;
  --line: #d3dcd8;
  --accent: #23725f;      /* celadon jade */
  --accent-soft: #dcece6;
  --chili: #b8402b;       /* chili oil */
  --chili-soft: #f6e1dc;
  --bamboo: #8a6420;      /* steamer bamboo */
  --bamboo-soft: #f3ead6;
  --code-bg: #142019;
  --code-ink: #e3ece7;
  --code-muted: #8fa39a;
  --code-key: #8fd4bd;
  --code-type: #f0c674;
  --code-str: #e8a07f;
  --code-num: #c9b1f2;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --step-4: clamp(2.4rem, 6vw, 3.6rem);
  --radius: 10px;
  --rail: 17rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #17201d; --ink: #e2ebe7; --muted: #9db0a8; --line: #2b3833;
    --accent: #6cc3a9; --accent-soft: #1b3129; --chili: #ef7d65; --chili-soft: #3a1f19;
    --bamboo: #dcb46a; --bamboo-soft: #33291a; --code-bg: #0a100d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #17201d; --ink: #e2ebe7; --muted: #9db0a8; --line: #2b3833;
  --accent: #6cc3a9; --accent-soft: #1b3129; --chili: #ef7d65; --chili-soft: #3a1f19;
  --bamboo: #dcb46a; --bamboo-soft: #33291a; --code-bg: #0a100d; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 0.18em; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- page frame ---------- */
.page { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 3rem; max-width: 84rem; margin: 0 auto; padding-inline: 1.5rem; padding-block: 2rem 6rem; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); align-self: start; max-height: calc(100vh - 2rem); overflow-y: auto; padding-right: 0.5rem; }
main { min-width: 0; max-width: 50rem; }
@media (max-width: 960px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; padding-inline: 1rem; }
  .rail { position: static; max-height: none; }
}

/* ---------- rail (order rail) ---------- */
.rail details { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.rail summary { cursor: pointer; padding: 0.75rem 1rem; font-family: var(--font-display); font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.rail summary::-webkit-details-marker { display: none; }
.rail summary .progress { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.rail ol { list-style: none; margin: 0; padding: 0 0.5rem 0.75rem; }
.rail .part-label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0.75rem 0.5rem 0.25rem; }
.rail li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); align-items: start; gap: 0.25rem; }
.rail li input { margin: 0.42rem 0 0; accent-color: var(--accent); width: 1rem; height: 1rem; }
.rail li a { display: block; padding: 0.2rem 0.4rem; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: var(--step--1); line-height: 1.4; }
.rail li a .n { font-family: var(--font-mono); color: var(--muted); margin-right: 0.35rem; font-variant-numeric: tabular-nums; }
.rail li a:hover { background: var(--accent-soft); }
.rail li a.current { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.rail li.done a { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.rail .rail-tools { display: flex; gap: 0.5rem; padding: 0 1rem 1rem; flex-wrap: wrap; }
.rail .rail-tools button { font: inherit; font-size: 0.8rem; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 0.2rem 0.7rem; cursor: pointer; }

/* ---------- hero ---------- */
.hero { padding-block: 1rem 2.5rem; border-bottom: 2px solid var(--ink); margin-bottom: 2.5rem; }
.hero .kicker { font-family: var(--font-mono); font-size: var(--step--1); color: var(--accent); letter-spacing: 0.04em; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--step-4); line-height: 1.02; letter-spacing: -0.02em; margin: 0.4rem 0 1rem; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lede { font-size: var(--step-1); max-width: 38rem; margin: 0 0 1.5rem; color: var(--ink); }
.stack { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0; margin: 0; list-style: none; }
.stack li { font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); background: var(--surface); padding: 0.25rem 0.6rem; border-radius: 999px; }
.stack li b { color: var(--accent); font-weight: 600; }

/* ---------- chapters as tickets ---------- */
section.chapter { margin-bottom: 4.5rem; scroll-margin-top: 1rem; }
.ticket { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 1.25rem; align-items: end; border-top: 2px dashed var(--line); padding-top: 1.25rem; margin-bottom: 1.5rem; }
.ticket .num { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 0.9; color: var(--accent); font-variant-numeric: tabular-nums; }
.ticket .meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.ticket h2 { font-family: var(--font-display); font-weight: 800; font-size: var(--step-3); line-height: 1.1; margin: 0.15rem 0 0; text-wrap: balance; letter-spacing: -0.01em; }
.part-break { font-family: var(--font-display); font-weight: 800; font-size: var(--step-2); margin: 5rem 0 2rem; padding: 1.25rem 1.5rem; background: var(--ink); color: var(--bg); border-radius: var(--radius); }
.part-break span { display: block; font-family: var(--font-mono); font-weight: 400; font-size: var(--step--1); opacity: 0.8; letter-spacing: 0.06em; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); margin: 2.25rem 0 0.5rem; text-wrap: balance; }
h4 { font-size: var(--step-0); margin: 1.5rem 0 0.25rem; }
p, ul, ol { margin: 0 0 1rem; }
li { margin-bottom: 0.3rem; }
main ul, main ol { padding-left: 1.4rem; }
strong { font-weight: 700; }
:not(pre) > code { font-family: var(--font-mono); font-size: 0.86em; background: var(--accent-soft); padding: 0.08em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
kbd { font-family: var(--font-mono); font-size: 0.82em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0.05em 0.35em; background: var(--surface); }
.path { font-family: var(--font-mono); font-size: 0.86em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }

/* ---------- steps ---------- */
ol.steps { counter-reset: step; list-style: none; padding-left: 0; }
ol.steps > li { counter-increment: step; position: relative; padding-left: 2.4rem; margin-bottom: 0.75rem; }
ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: 0.05rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 0.8rem; display: grid; place-items: center; }

/* ---------- callouts ---------- */
.note { border-radius: var(--radius); padding: 0.9rem 1.1rem; margin: 1.5rem 0; border: 1px solid var(--line); background: var(--surface); }
.note > :last-child { margin-bottom: 0; }
.note .tag { display: inline-block; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.35rem; }
.note.why { background: var(--accent-soft); border-color: transparent; }
.note.why .tag { color: var(--accent); }
.note.gotcha { background: var(--chili-soft); border-color: transparent; }
.note.gotcha .tag { color: var(--chili); }
.note.review { background: var(--bamboo-soft); border-color: transparent; }
.note.review .tag { color: var(--bamboo); }
.note.thennow .tag { color: var(--muted); }
.thennow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.thennow-grid > div { min-width: 0; }
.thennow-grid h5 { margin: 0 0 0.25rem; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
@media (max-width: 640px) { .thennow-grid { grid-template-columns: 1fr; } }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin: 1rem 0 1.5rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* ---------- code ---------- */
figure.code { margin: 1.25rem 0 1.75rem; border-radius: var(--radius); overflow: hidden; background: var(--code-bg); }
figure.code figcaption { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.5rem 0.9rem; font-family: var(--font-mono); font-size: 0.78rem; color: var(--code-muted); border-bottom: 1px solid rgba(255,255,255,0.08); }
figure.code figcaption .file { color: var(--code-ink); overflow-wrap: anywhere; min-width: 0; }
figure.code figcaption .dir { color: var(--code-muted); }
figure.code button.copy { flex: none; font: inherit; color: var(--code-ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 0.15rem 0.6rem; cursor: pointer; }
figure.code button.copy:hover { background: rgba(255,255,255,0.16); }
figure.code pre { margin: 0; padding: 1rem 1.1rem; overflow-x: auto; max-height: 34rem; }
figure.code.short pre { max-height: none; }
figure.code code, pre.plain code { font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.55; color: var(--code-ink); tab-size: 4; }
pre.plain { background: var(--code-bg); color: var(--code-ink); padding: 1rem 1.1rem; border-radius: var(--radius); overflow-x: auto; margin: 1rem 0 1.5rem; }
details.expand > summary { cursor: pointer; font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); margin: -1rem 0 1.5rem; }
.token.comment, .token.prolog { color: var(--code-muted); font-style: italic; }
.token.keyword, .token.boolean, .token.null { color: var(--code-key); }
.token.class-name, .token.namespace, .token.type-expression, .token.return-type { color: var(--code-type); }
.token.string, .token.char, .token.interpolation-string { color: var(--code-str); }
.token.number { color: var(--code-num); }
.token.attribute, .token.attr-name { color: var(--code-type); }
.token.punctuation, .token.operator { color: #b9c9c1; }
.token.property { color: var(--code-key); }

/* ---------- diagrams ---------- */
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin: 1.25rem 0 1.75rem; overflow-x: auto; }
.diagram pre.mermaid { margin: 0; background: none; text-align: center; }
.diagram figcaption { font-size: var(--step--1); color: var(--muted); margin-top: 0.5rem; }

/* ---------- rules card ---------- */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; margin: 1.5rem 0 2rem; }
.rules > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; min-width: 0; }
.rules h4 { margin: 0 0 0.35rem; font-family: var(--font-display); font-size: var(--step-1); }
.rules ul { margin: 0; padding-left: 1.1rem; font-size: var(--step--1); }
.rules .role { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }

.tree { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; overflow-x: auto; white-space: pre; margin: 1rem 0 1.5rem; }
.tree .c { color: var(--muted); }

footer.end { border-top: 2px solid var(--ink); padding-top: 1.5rem; color: var(--muted); font-size: var(--step--1); }
</style>
